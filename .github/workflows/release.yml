name: Release

# Push a tag like v0.3.0 to publish a GitHub release for that version.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - run: npm ci
      - run: npm run build

      - name: Package build
        run: cd dist && zip -qr "../fuadalizada.com-$GITHUB_REF_NAME.zip" .

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "fuadalizada.com-$GITHUB_REF_NAME.zip" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
